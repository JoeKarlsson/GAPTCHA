<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://plausible.joekarlsson.io 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' data: blob: https://plausible.joekarlsson.io; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Scan a marker | GAPTCHA</title>
  <meta name="description" content="Point your camera at a GAPTCHA marker to see which way the hidden checkpoint is.">
  <meta name="author" content="Joe Karlsson">
  <link rel="canonical" href="https://gaptcha.joekarlsson.com/play.html">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#11DFC7">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GAPTCHA">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://gaptcha.joekarlsson.com/play.html">
  <meta property="og:title" content="Scan a marker | GAPTCHA">
  <meta property="og:description" content="Point your camera at a GAPTCHA marker to see which way the hidden checkpoint is.">
  <meta property="og:image" content="https://gaptcha.joekarlsson.com/img/og.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GAPTCHA: Find, scan, win">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Scan a marker | GAPTCHA">
  <meta name="twitter:description" content="Point your camera at a GAPTCHA marker to see which way the hidden checkpoint is.">
  <meta name="twitter:image" content="https://gaptcha.joekarlsson.com/img/og.png?v=2">
  <meta name="twitter:image:alt" content="GAPTCHA: Find, scan, win">
  <meta name="twitter:site" content="@joekarlsson1">
  <meta name="twitter:creator" content="@joekarlsson1">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="css/play.css">

  <script src="js/analytics.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js" integrity="sha384-q1j3u8zN/0QJFO0o9kVr8f8K90iXlGi6GHo+ou7YnVAfdgXmnH8W/naze8//B2c5" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js" integrity="sha384-kMj13PP2WxCked2mWrDVWumIvqdYCYjifhPfsyYBF1av1wP+g7P/hp6kWVGtWrrD" crossorigin="anonymous"></script>
  <script type="module" src="js/play.js"></script>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Scan a GAPTCHA marker</h1>
    <a-scene embedded
      arjs="sourceType: webcam; detectionMode: mono; cameraParametersUrl: data/camera_para.dat; debugUIEnabled: false"
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
      aria-label="Camera view. When a GAPTCHA marker is in view, an arrow on it points toward the hidden checkpoint.">
      <a-marker id="marker" type="pattern" url="data/patt.gaptcha">
        <!-- The arrow points along -Z, the top edge of the marker. JS turns it to the checkpoint's bearing. -->
        <a-entity id="arrow" position="0 0.1 0">
          <a-cone position="0 0 -0.35" rotation="-90 0 0" radius-bottom="0.25" radius-top="0" height="0.4" color="#11DFC7"></a-cone>
          <a-cylinder position="0 0 0.1" rotation="-90 0 0" radius="0.08" height="0.5" color="#11DFC7"></a-cylinder>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <div class="panel">
      <p id="status" role="status" aria-live="polite">Finding your location…</p>
      <div class="hunters">
        <p id="hunter-stats"></p>
        <div role="log" aria-live="polite" aria-label="Other hunters"><ul id="hunter-feed" class="hunter-feed"></ul></div>
        <p class="simulated-note">Other hunters are simulated in this demo.</p>
      </div>
      <p class="help">Hold the marker so its printed name is on top and facing north. <a href="./">Back to GAPTCHA</a></p>
    </div>
  </main>
</body>
</html>
